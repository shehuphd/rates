name: release gate

# The docs-vs-code release gate: shiplock's deterministic checks plus its
# optional semantic audit, via shiplock's reusable workflow. The audit
# auto-skips when no AUDIT_API_KEY is set, so this gate runs (deterministic
# only) with no secrets configured.
#
# AUDIT_API_KEY and AUDIT_FALLBACK_API_KEY are each a single "<provider>/<key>"
# string, and either can name any provider. No model is named here: with the
# model inputs left empty, the reusable gate verifies each key live through
# keycall and runs the audit on the model the key's own catalog answers with.
# The audit runs on AUDIT_API_KEY first; AUDIT_FALLBACK_API_KEY takes over
# when that attempt dies mid-run.

# Manual for now, matching ci.yml, while the account's Actions minutes are
# limited. Enable pull_request to gate every merge once they're available:
#   pull_request:
#     branches: [main]
on:
  workflow_dispatch:

permissions: {}

jobs:
  gate:
    # A called workflow can't hold more than its caller grants, and the
    # top level grants nothing: the gate's jobs read the checkout, and its
    # audit job opens an issue in this repo when the audit fails.
    permissions:
      contents: read
      issues: write
    uses: shehuphd/shiplock/.github/workflows/gate.yml@main
    with:
      shiplock-spec: "shiplock>=0.3.1"
      run-audit: true
    secrets:
      AUDIT_API_KEY: ${{ secrets.AUDIT_API_KEY }}
      AUDIT_FALLBACK_API_KEY: ${{ secrets.AUDIT_FALLBACK_API_KEY }}
