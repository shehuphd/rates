name: ledger

# Manual-only until a first run succeeds; the weekly cron gets enabled
# after that:
#   schedule:
#     - cron: "0 6 * * 1"
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e . pytest

      - name: Source drift probes
        env:
          RATES_LIVE_PROBES: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest tests/test_source_probes.py -q

      - name: Build ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_ledger.py

      - name: Full test suite against the new ledger
        run: python -m pytest tests/ -q

      - name: Commit bundled ledger
        run: |
          git config user.name "ledger-bot"
          git config user.email "actions@github.com"
          git add src/rates/ai/ledger-ai.json.gz
          git diff --cached --quiet && echo "ledger unchanged" && exit 0
          git commit -m "Update bundled AI ledger ($(date -u +%F))"
          git push

      - name: Publish ledger release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ledger-$(date -u +%F)"
          gh release create "$TAG" ledger-ai.json \
            --title "$TAG" \
            --notes "Weekly AI-universe pricing ledger, snapshot $(date -u +%F)." \
            --latest=false
