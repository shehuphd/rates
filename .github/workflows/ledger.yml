name: ledger

# Weekly rebuild of the bundled AI ledger from the upstream sources,
# plus manual runs on demand.
on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-ledger:
    runs-on: ubuntu-latest
    steps:
      # Authenticate with a fine-grained PAT (contents:write on this repo)
      # so the ledger commit pushes as its owner, a ruleset bypass actor;
      # the default GITHUB_TOKEN is blocked by main's pull-request rule.
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.LEDGER_PAT }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e . pytest pytest-randomly "keycall>=1.11.1"

      - name: Source drift probes
        env:
          RATES_LIVE_PROBES: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m pytest tests/test_source_probes.py tests/test_keycall_probe.py -q

      - name: Build ledger
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_ledger.py

      # Rewrite the exact count samples in the docs to the rebuilt ledger
      # before the test suite runs its docs-count guard, so a refreshed
      # ledger never leaves the docs quoting last week's figures.
      - name: Sync doc counts to the rebuilt ledger
        run: python scripts/sync_docs.py

      - name: Full test suite against the new ledger
        run: python -m pytest tests/ -q

      # Every run produces a new ledger by design (52 dated snapshots a
      # year; snapshot_date alone changes it), so there's no
      # skip-if-unchanged branch here.
      - name: Commit bundled ledger and doc counts
        run: |
          git config user.name "ledger-bot"
          git config user.email "actions@github.com"
          git add src/rates/ai/ledger-ai.json.gz README.md USAGE.md
          git commit -m "Update bundled AI ledger ($(date -u +%F))"
          git push

      - name: Publish ledger release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ledger-$(date -u +%F)"
          gh release create "$TAG" ledger-ai.json \
            --title "$TAG" \
            --notes "Weekly AI-domain pricing ledger, snapshot $(date -u +%F)." \
            --latest=false
