name: ci

# Manual-only while the account's Actions minutes are exhausted; once a
# manual run succeeds, enable:
#   push:
#     branches: [main]
#   pull_request:
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install -e . pytest pytest-randomly mypy ruff keycall

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Type check
        run: python -m mypy src

      - name: Tests
        run: python -m pytest tests -q
