[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rates"
version = "1.0.0"
description = "A pricing registry and decision layer. AI model pricing, capabilities, and lifecycle."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Mo Shehu" }]
keywords = [
    "llm",
    "pricing",
    "model-selection",
    "openai",
    "anthropic",
    "gemini",
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
rates = "rates._cli:main"

[project.urls]
Homepage = "https://github.com/shehuphd/rates"
Repository = "https://github.com/shehuphd/rates"
Changelog = "https://github.com/shehuphd/rates/blob/main/CHANGELOG.md"

[tool.pytest.ini_options]
# Execution order is randomized every run (a failure caused by order is a
# bug, never hidden by pinning the order); the plugin is required so a run
# without it fails loudly instead of silently going sequential.
required_plugins = ["pytest-randomly"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = true
